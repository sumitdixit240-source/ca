<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Now - CA Mohit Dixit</title>
<style>
:root {
  --primary-color: #004aad;
  --accent-color: #ffc107;
  --text-color: #333;
}

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f8f9fa;
  color: var(--text-color);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

header {
  background-color: var(--primary-color);
  color: white;
  text-align: center;
  width: 100%;
  padding: 15px 10px;
  font-size: 1.3em;
  font-weight: 500;
}

.container {
  width: 90%;
  max-width: 500px;
  background: white;
  margin-top: 30px;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  text-align: center;
}

.container h2 {
  color: var(--primary-color);
  margin-bottom: 15px;
}

.qr-img {
  width: 200px;
  margin: 20px 0;
  border: 3px solid var(--primary-color);
  border-radius: 8px;
}

.upi-details {
  text-align: left;
  background: #f1f1f1;
  padding: 15px;
  border-radius: 8px;
  font-size: 1em;
  margin: 15px 0;
  line-height: 1.5;
}

.upi-details strong { color: var(--primary-color); }

input[type="text"] {
  width: 100%;
  padding: 10px;
  margin: 10px 0 15px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
  font-size: 1em;
}

.btn-pay {
  display: inline-block;
  padding: 12px 25px;
  background-color: var(--accent-color);
  color: #000;
  border-radius: 5px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.btn-pay:hover {
  background-color: #e6b800;
}

.btn-back {
  display: inline-block;
  padding: 10px 20px;
  background-color: var(--primary-color);
  color: white;
  border-radius: 5px;
  text-decoration: none;
  transition: 0.3s;
  margin-top: 15px;
}

.btn-back:hover {
  background-color: #00388a;
}

footer {
  margin-top: auto;
  padding: 20px;
  color: #777;
  text-align: center;
  font-size: 0.9em;
}

@media (max-width: 600px) {
  .qr-img { width: 150px; }
  .container { padding: 20px; }
}
</style>
</head>
<body>

<header>💳 Secure Payment - CA Mohit Dixit</header>

<div class="container">
  <h2>Scan & Pay via UPI</h2>
  
  <!-- Default QR Code -->
  <img src="paytm-qr.png" alt="Paytm QR Code" class="qr-img">

  <div class="upi-details">
    <strong>Default UPI ID:</strong> 9310664643@paytm<br>
    <strong>Name:</strong> CA Mohit Dixit<br>
  </div>

  <div class="upi-details" id="servicesList">
    <!-- Selected services will be listed here -->
  </div>

  <div><strong>Grand Total: ₹<span id="grandTotal">0</span></strong></div>

  <input type="text" id="upiId" placeholder="Enter your UPI ID (optional)">
  <button class="btn-pay" id="payNow">Pay Now</button>

  <a href="services.html" class="btn-back">← Back to Services</a>
</div>

<footer>&copy; 2025 CA Mohit Dixit | All Rights Reserved</footer>

<script>
  // Default your UPI ID
  const defaultUpi = "9310664643@paytm";

  // Get URL params
  const params = new URLSearchParams(window.location.search);

  // Example: services=Tax Filing:2000,GST Return:1500,Audit:3000
  const servicesParam = params.get("services") || "";
  const invoiceNo = params.get("invoice") || "N/A";

  const servicesListDiv = document.getElementById("servicesList");
  let grandTotal = 0;

  if(servicesParam) {
    const servicesArray = servicesParam.split(",");
    servicesArray.forEach(service => {
      const [name, amount] = service.split(":");
      grandTotal += parseFloat(amount) || 0;

      const serviceDiv = document.createElement("div");
      serviceDiv.innerHTML = `<strong>Service:</strong> ${name}<br><strong>Amount:</strong> ₹${amount}<br>`;
      servicesListDiv.appendChild(serviceDiv);
    });
  } else {
    servicesListDiv.innerHTML = "No services selected.";
  }

  document.getElementById("grandTotal").textContent = grandTotal.toFixed(2);

  // Pay Now button click
  document.getElementById("payNow").addEventListener("click", () => {
    let upiId = document.getElementById("upiId").value.trim();
    if(!upiId) upiId = defaultUpi; // Use default if none entered

    const upiLink = `upi://pay?pa=${upiId}&pn=${encodeURIComponent('CA Mohit Dixit')}&tn=${encodeURIComponent('Payment for Invoice ' + invoiceNo)}&am=${grandTotal}&cu=INR`;

    // Redirect to UPI app
    window.location.href = upiLink;
  });
</script>

</body>
</html>
